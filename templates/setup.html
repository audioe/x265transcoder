<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x265 Transcoder - Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <meta name="theme-color" content="#1e1e1e">
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-brand">x265 Transcoder</div>
        <button class="mobile-menu-toggle" aria-label="Toggle navigation" onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
        <div class="nav-links-bar" id="nav-links">
            <a href="{{ url_for('index') }}" class="nav-link {% if active_page == 'home' %}active{% endif %}">Transcode</a>
            <a href="{{ url_for('scheduler_view') }}" class="nav-link {% if active_page == 'scheduler' %}active{% endif %}">Scheduler</a>
            <a href="{{ url_for('recommendations') }}" class="nav-link {% if active_page == 'recommendations' %}active{% endif %}">Recommendations</a>
            <a href="{{ url_for('history') }}" class="nav-link {% if active_page == 'history' %}active{% endif %}">History</a>
            <a href="{{ url_for('logs') }}" class="nav-link {% if active_page == 'logs' %}active{% endif %}">Logs</a>
            <a href="{{ url_for('setup') }}" class="nav-link nav-link-secondary">Settings</a>
        </div>
        <span class="nav-version">v{{ version }}</span>
    </nav>

    <div class="container page-content">
    <h3>Settings</h3>
    <form method="POST">
        <p>Enable Telegram Notifications:</p>
        <label class="switch">
            <input type="checkbox" id="use_telegram" name="use_telegram">
            <span class="slider round"></span>
        </label>

        <div id="telegram_details" style="display: {% if use_telegram %}block{% else %}none{% endif %};">
            <label for="telegram_chat_id">Enter Telegram Chat ID:</label>
            <input type="text" id="telegram_chat_id" name="telegram_chat_id" value="{{ telegram_chat_id }}"><br>
    
            <label for="telegram_token">Enter Telegram Token:</label>
            <input type="text" id="telegram_token" name="telegram_token" value="{{ telegram_token }}"><br>
        </div>
    
        <h2>Library Directories</h2>
        <label for="shows_directory">Shows Directory:</label>
        <input type="text" id="shows_directory" name="shows_directory" value="{{ default_shows }}" required><br>
    
        <label for="films_directory">Films Directory:</label>
        <input type="text" id="films_directory" name="films_directory" value="{{ default_films }}" required><br>

        <h2>Encoder</h2>
        <label for="encoder">Hardware Encoder:</label>
        <select id="encoder" name="encoder">
            <option value="auto" {% if current_encoder == 'auto' %}selected{% endif %}>Auto-detect</option>
            <option value="qsv" {% if current_encoder == 'qsv' %}selected{% endif %}>Intel QSV</option>
            <option value="vaapi" {% if current_encoder == 'vaapi' %}selected{% endif %}>AMD VAAPI</option>
            <option value="nvenc" {% if current_encoder == 'nvenc' %}selected{% endif %}>NVIDIA NVENC</option>
            <option value="software" {% if current_encoder == 'software' %}selected{% endif %}>Software (libx265)</option>
        </select>

        <input type="submit" value="Save Configuration">
    </form>
    </div>

    <script>
        document.getElementById('use_telegram').addEventListener('change', function() {
            var details = document.getElementById("telegram_details");
            details.style.display = this.checked ? "block" : "none";
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('New update available');
                            }
                        });
                    });
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });

                let refreshing;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    window.location.reload();
                    refreshing = true;
                });
            });
        }
    </script>
</body>
</html>
